<h2>Reset your Powertek password</h2>
<p>We received a request to reset your password. Follow the link below to choose a new one.</p>
<p><a href="https://powertek-app.vercel.app/reset-password?token_hash={{ .TokenHash }}&amp;type=recovery">Choose a new password</a></p>
<p>This link can be used once. If it has expired, request a new email from the sign-in page.</p>
<p>If you didn't request this, you can safely ignore this email.</p>
